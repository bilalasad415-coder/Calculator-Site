<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compound Interest Calculator - Investment Growth Estimator</title>
<meta name="description" content="Free compound interest calculator. See how your savings or investments grow over time with monthly contributions and compounding.">
<style>
  :root{--navy:#0F2A3D;--teal:#1B4B5A;--gold:#D9A441;--bg:#F6F4EF;--ink:#16232B;--muted:#5A6570;--card:#FFFFFF;--line:#E4DFD3;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 60px;}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:28px;color:var(--navy);margin:0 0 6px;letter-spacing:-0.3px;}
  .sub{color:var(--muted);font-size:15px;margin:0 0 28px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:20px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--teal);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px;}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:7px;font-size:15px;background:#FCFBF8;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  button{margin-top:22px;width:100%;padding:14px;background:var(--navy);color:#fff;border:none;border-radius:7px;font-size:16px;font-weight:600;cursor:pointer;}
  button:hover{background:var(--teal);}
  .result{background:var(--navy);color:#fff;border-radius:10px;padding:26px;text-align:center;display:none;}
  .result.show{display:block;}
  .result .amt{font-family:Georgia,serif;font-size:40px;color:var(--gold);margin:4px 0;}
  .result .label{font-size:13px;opacity:.8;text-transform:uppercase;letter-spacing:.5px;}
  .breakdown{margin-top:18px;text-align:left;border-top:1px solid rgba(255,255,255,.15);padding-top:16px;}
  .brow{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;opacity:.9;}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Compound Interest Calculator</h1>
  <p class="sub">See how your money grows over time with compounding and regular contributions.</p>

  <div class="card">
    <label for="principal">Initial Investment ($)</label>
    <input type="number" id="principal" value="5000">

    <div class="row">
      <div>
        <label for="monthly">Monthly Contribution ($)</label>
        <input type="number" id="monthly" value="200">
      </div>
      <div>
        <label for="rate">Annual Return Rate (%)</label>
        <input type="number" id="rate" step="0.1" value="7">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="years">Time Period (years)</label>
        <input type="number" id="years" value="20">
      </div>
      <div>
        <label for="freq">Compounding</label>
        <select id="freq">
          <option value="12" selected>Monthly</option>
          <option value="4">Quarterly</option>
          <option value="1">Annually</option>
        </select>
      </div>
    </div>

    <button onclick="calc()">Calculate Growth</button>
  </div>

  <div class="result" id="result">
    <div class="label">Future Value</div>
    <div class="amt" id="future">$0</div>
    <div class="breakdown">
      <div class="brow"><span>Total Contributions</span><span id="contrib">$0</span></div>
      <div class="brow"><span>Total Interest Earned</span><span id="interest">$0</span></div>
    </div>
  </div>

  <footer>Estimates assume a constant rate of return, which real investments rarely provide. Not financial advice.</footer>
</div>

<script>
function calc(){
  const P = parseFloat(document.getElementById('principal').value)||0;
  const PMT = parseFloat(document.getElementById('monthly').value)||0;
  const rate = parseFloat(document.getElementById('rate').value)/100;
  const years = parseFloat(document.getElementById('years').value)||0;
  const n = parseInt(document.getElementById('freq').value);

  const r = rate/n;
  const periods = n*years;
  // future value of initial principal
  const fvPrincipal = P*Math.pow(1+r,periods);
  // future value of monthly contributions (converted to per-period contribution)
  const contribPerPeriod = PMT*12/n;
  const fvContrib = r===0 ? contribPerPeriod*periods : contribPerPeriod*((Math.pow(1+r,periods)-1)/r);

  const future = fvPrincipal+fvContrib;
  const totalContrib = P+(PMT*12*years);
  const totalInterest = future-totalContrib;

  document.getElementById('future').textContent = '$'+future.toFixed(2);
  document.getElementById('contrib').textContent = '$'+totalContrib.toFixed(2);
  document.getElementById('interest').textContent = '$'+totalInterest.toFixed(2);
  document.getElementById('result').classList.add('show');
}
calc();
</script>
</body>
</html>
