<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tip Calculator - Calculate Tip & Split the Bill</title>
<meta name="description" content="Free tip calculator. Quickly work out how much to tip and split the bill evenly among any number of people.">
<style>
  :root{--navy:#0F2A3D;--teal:#1B4B5A;--gold:#D9A441;--bg:#F6F4EF;--ink:#16232B;--muted:#5A6570;--card:#FFFFFF;--line:#E4DFD3;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;}
  .wrap{max-width:520px;margin:0 auto;padding:32px 20px 60px;}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:28px;color:var(--navy);margin:0 0 6px;letter-spacing:-0.3px;}
  .sub{color:var(--muted);font-size:15px;margin:0 0 28px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;margin-bottom:20px;}
  label{display:block;font-size:13px;font-weight:600;color:var(--teal);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px;}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:7px;font-size:15px;background:#FCFBF8;color:var(--ink);}
  input:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .pct-group{display:flex;gap:8px;margin-top:6px;}
  .pct-btn{flex:1;padding:10px;text-align:center;border:1px solid var(--line);border-radius:7px;background:#FCFBF8;cursor:pointer;font-weight:600;color:var(--teal);}
  .pct-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .stepper button{width:38px;height:38px;border-radius:7px;border:1px solid var(--line);background:#FCFBF8;font-size:18px;cursor:pointer;color:var(--navy);}
  .stepper span{font-size:16px;font-weight:600;min-width:24px;text-align:center;}
  .result{background:var(--navy);color:#fff;border-radius:10px;padding:26px;text-align:center;margin-top:20px;}
  .result .amt{font-family:Georgia,serif;font-size:36px;color:var(--gold);margin:4px 0;}
  .result .label{font-size:13px;opacity:.8;text-transform:uppercase;letter-spacing:.5px;}
  .breakdown{margin-top:16px;text-align:left;border-top:1px solid rgba(255,255,255,.15);padding-top:14px;}
  .brow{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;opacity:.9;}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tip Calculator</h1>
  <p class="sub">Work out the tip and split the bill in seconds.</p>

  <div class="card">
    <label for="bill">Bill Amount ($)</label>
    <input type="number" id="bill" value="60" oninput="calc()">

    <label>Tip Percentage</label>
    <div class="pct-group" id="pctGroup">
      <div class="pct-btn" data-pct="10" onclick="selectPct(10)">10%</div>
      <div class="pct-btn active" data-pct="15" onclick="selectPct(15)">15%</div>
      <div class="pct-btn" data-pct="18" onclick="selectPct(18)">18%</div>
      <div class="pct-btn" data-pct="20" onclick="selectPct(20)">20%</div>
    </div>

    <label for="split">Split Between</label>
    <div class="stepper">
      <button onclick="changePeople(-1)">−</button>
      <span id="people">1</span>
      <button onclick="changePeople(1)">+</button>
      <span style="color:var(--muted);font-size:13px;">people</span>
    </div>
  </div>

  <div class="result">
    <div class="label">Total Per Person</div>
    <div class="amt" id="perPerson">$0</div>
    <div class="breakdown">
      <div class="brow"><span>Tip Amount</span><span id="tipAmt">$0</span></div>
      <div class="brow"><span>Total Bill (with tip)</span><span id="totalBill">$0</span></div>
      <div class="brow"><span>Tip Per Person</span><span id="tipPP">$0</span></div>
    </div>
  </div>

  <footer>Standard US tipping guide: 15% average, 18-20% for great service, 10% for basic service.</footer>
</div>

<script>
let currentPct = 15;
let people = 1;
function selectPct(p){
  currentPct = p;
  document.querySelectorAll('.pct-btn').forEach(b=>b.classList.toggle('active', parseInt(b.dataset.pct)===p));
  calc();
}
function changePeople(delta){
  people = Math.max(1, people+delta);
  document.getElementById('people').textContent = people;
  calc();
}
function calc(){
  const bill = parseFloat(document.getElementById('bill').value)||0;
  const tip = bill*(currentPct/100);
  const total = bill+tip;
  document.getElementById('tipAmt').textContent = '$'+tip.toFixed(2);
  document.getElementById('totalBill').textContent = '$'+total.toFixed(2);
  document.getElementById('perPerson').textContent = '$'+(total/people).toFixed(2);
  document.getElementById('tipPP').textContent = '$'+(tip/people).toFixed(2);
}
calc();
</script>
</body>
</html>
